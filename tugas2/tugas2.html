<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Aplikasi Nota Warung</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="tugas2.css">
</head>
<body>

<div class="container">
    <h3>Nota Warung</h3>
    
    <div class="tabel">
        <label>Menu:</label>
        <select id="menu">
            <option value="0">--Pilih Menu--</option>
            <option value="3000">Mie Instan</option>
            <option value="5000">Kopi</option>
            <option value="4000">Roti</option>
            <option value="2000">Teh</option>
        </select>
    </div>

    <div class="tabel">
        <label>Harga:</label>
        <input type="text" id="harga" placeholder="0">
    </div>

    <div class="tabel">
        <label>Jumlah:</label>
        <input type="number" id="jumlah" min="1" value="1">
    </div>

    <button id="hitung">Hitung</button><br><br>

    <div id="total-display">
        Total Harga : Rp <span id="hasil">0</span>
    </div>
</div>

<script>
$(document).ready(function() { 
    $('#menu').change(function() {
        let harga = $(this).val(); 
        $('#harga').val(harga);
    });

    $('#hitung').click(function() {
        let harga = parseInt($('#harga').val());
        let jumlah = parseInt($('#jumlah').val());
        $('#hasil').text(harga*jumlah);
    });
});
</script>

</body>
</html>
