<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login</title>
    <link rel="stylesheet" href="tugas1.css">
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <form novalidate>
            <h2>From Login</h2>
            <div class="input">
                <label>Username</label><br>
                <input id="user" type="text" placeholder="Masukkan Username">
                <span id="user-error" class="sembunyi">Input tidak valid</span>
            </div>
            <br>
            <div class="input">
                <label>Password</label><br>
                <input id="pw" type="password" placeholder="Masukkan Password">
                <span id="pw-error" class="sembunyi">Input tidak valid</span>
            </div>
            <button id="login">Login</button>
        </form>
    </div>
     
    <script src="tugas1.js"></script>

</body>

</html>
